<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Entrar</title>
<style>html,body{background:#0a0a0a !important}</style>
<link rel="icon" type="image/svg+xml" href="../../assets/logo/favcon.svg" id="mh-favicon-root">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo:wght@300;500;600&family=Exo+2:wght@300;400;500;600;700;800&family=Quicksand:wght@500;600&display=swap"></noscript>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a0a !important;
  }
  .hero-bg {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background: #0a0a0a;
  }
  .hero-dots {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.4s ease;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 78%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 78%, transparent 100%);
  }
  .hero-dots.show {
    opacity: 1;
  }

  /* ===== Auth (login por email) ===== */
  .onboarding {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .onboarding-card {
    width: 100%;
    max-width: 260px;
    text-align: center;
    opacity: 0;
    transform: translateY(8px);
    animation: fadeInUp 0.9s ease 0.3s forwards;
    position: relative;
    z-index: 1;
  }
  .onboarding-card::before {
    content: '';
    position: absolute;
    inset: -28px -22px -24px;
    background: #0a0a0a;
    border-radius: 18px;
    z-index: -1;
  }
  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .onboarding-title {
    font-family: 'Exo', sans-serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: -0.01em;
    color: #fafafa;
    margin-bottom: 6px;
  }
  .onboarding-subtitle {
    font-family: 'Quicksand', sans-serif;
    font-weight: 500;
    font-size: 10.5px;
    color: #838383;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  /* ===== Campo de email ===== */
  .email-field {
    position: relative;
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.035);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 2px 2px 2px 12px;
    transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  }
  .email-field:focus-within {
    border-color: rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.05);
    box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
  }
  .email-field input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    padding: 8px 6px;
    font-family: 'Exo 2', sans-serif;
    font-weight: 500;
    font-size: 11.5px;
    color: #fafafa;
    letter-spacing: 0.01em;
  }
  .email-field input::placeholder {
    color: #525252;
  }
  .email-field .continue-btn {
    flex-shrink: 0;
    width: 0;
    height: 26px;
    margin-left: 0;
    border-radius: 7px;
    border: none;
    background: #fafafa;
    color: #0a0a0a;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    overflow: hidden;
    pointer-events: none;
    transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1), margin-left 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease, transform 0.15s ease;
  }
  .email-field .continue-btn.show {
    width: 26px;
    margin-left: 5px;
    opacity: 0.35;
  }
  .email-field .continue-btn.active {
    opacity: 1;
    pointer-events: auto;
  }
  .email-field .continue-btn.active:hover {
    transform: scale(1.06);
  }
  .auth-hint {
    margin-top: 8px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 500;
    font-size: 10px;
    color: #626262;
    min-height: 13px;
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .auth-hint.show {
    opacity: 1;
    transform: translateY(0);
  }
  .auth-hint.error {
    color: #d98888;
  }
  .auth-hint.ok {
    color: #7ecca6;
  }

  /* ===== Divisor "ou" ===== */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 0 14px;
  }
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }
  .divider span {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #4a4a4a;
  }

  /* ===== Botão do Google ===== */
  .google-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 9px 0;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.035);
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.15s ease;
  }
  .google-btn:hover {
    border-color: rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.055);
  }
  .google-btn:active {
    transform: scale(0.98);
  }
  .google-btn svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  .google-btn span {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    color: #fafafa;
    letter-spacing: 0.01em;
  }

  /* ===== Termos e política ===== */
  .auth-terms {
    margin-top: 22px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 500;
    font-size: 10px;
    line-height: 1.6;
    color: #565656;
    letter-spacing: 0.005em;
  }
  .auth-terms a {
    color: #8f8f8f;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    transition: color 0.25s ease, border-color 0.25s ease;
  }
  .auth-terms a:hover {
    color: #fafafa;
    border-color: rgba(255,255,255,0.4);
  }

  /* ===== Modal de Termos/Privacidade ===== */
  .legal-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, backdrop-filter 0.4s ease;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(0px);
  }
  .legal-modal.show {
    opacity: 1;
    pointer-events: auto;
    backdrop-filter: blur(4px);
  }
  .legal-modal-content {
    background: #09090b;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    width: 95%;
    max-width: 960px;
    height: 55vh;
    display: flex;
    flex-direction: column;
    transform: translateY(20px) scale(0.99);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8);
    overflow: hidden;
  }
  .legal-modal.show .legal-modal-content {
    transform: translateY(0) scale(1);
  }
  .legal-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px 8px;
    background: transparent;
    position: relative;
    z-index: 10;
  }
  .legal-modal-header-title {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #71717a;
    margin: 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .legal-modal-close {
    background: transparent;
    border: none;
    color: #52525b;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    cursor: pointer;
    transition: color 0.2s ease;
  }
  .legal-modal-close:hover {
    color: #fafafa;
    transform: none;
  }
  .legal-modal-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  .legal-modal-body {
    flex: 1;
    padding: 12px 32px 40px 32px;
    overflow-y: auto;
    color: #a1a1aa;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.7;
    position: relative;
  }
  .legal-modal-body::-webkit-scrollbar {
    width: 4px;
  }
  .legal-modal-body::-webkit-scrollbar-track {
    background: transparent;
  }
  .legal-modal-body::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 4px;
  }
  .legal-modal-body::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.15);
  }
  .legal-modal-body h3 {
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 500;
    color: #fff;
    margin-top: 2.5em;
    margin-bottom: 0.8em;
    padding-bottom: 0;
    border-bottom: none;
  }
  .legal-modal-body h3:first-child {
    margin-top: 0;
  }
  .legal-modal-body h4 {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: #e4e4e7;
    margin-top: 2em;
    margin-bottom: 0.6em;
  }
  .legal-modal-body p, .legal-modal-body ul, .legal-modal-body ol {
    margin-bottom: 1.2em;
  }
  .legal-modal-body ul, .legal-modal-body ol {
    padding-left: 20px;
  }
  .legal-modal-body li {
    margin-bottom: 0.5em;
  }
  .legal-modal-body strong {
    color: #e4e4e7;
    font-weight: 500;
  }
  .legal-modal-spy {
    width: 180px;
    padding: 24px 24px 24px 0;
    background: transparent; 
    border-left: none; 
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .spy-inner {
    display: flex;
    flex-direction: column;
    gap: 12px; 
    border-left: 1px solid rgba(255,255,255,0.03); 
    padding-left: 16px;
  }
  .legal-modal-spy::-webkit-scrollbar {
    display: none;
  }
  .spy-item {
    display: flex;
    align-items: center;
    color: #52525b; 
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    transition: all 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    padding: 2px 0;
    position: relative;
  }
  .spy-item:hover {
    color: #a1a1aa;
  }
  .spy-item.active {
    color: #fafafa;
  }
  .spy-dash {
    position: absolute;
    left: -17px; 
    width: 2px;
    height: 0;
    background: transparent;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .spy-item.active .spy-dash {
    background: #fff; 
    height: 14px;
    top: 50%;
    transform: translateY(-50%);
  }
  .spy-label {
    text-overflow: ellipsis;
    overflow: hidden;
  }

  @media (max-width: 640px) {
    .legal-modal-spy {
      display: none;
    }
    .legal-modal-body {
      padding: 24px 20px;
    }
    .legal-modal-content {
      max-width: 100%;
      height: 90vh;
      border-radius: 16px 16px 0 0;
      transform: translateY(100%);
    }
    .legal-modal.show .legal-modal-content {
      transform: translateY(0);
    }
    .legal-modal {
      padding: 0;
      align-items: flex-end;
    }
  }
</style>

<script>
    class ScatterPointGenerator {
      constructor(width, height, minDistance, maxAttempts) {
        this.width = width;
        this.height = height;
        this.minDistance = minDistance;
        this.maxAttempts = maxAttempts;
        this.cellSize = minDistance * Math.SQRT1_2;
        this.cellMap = new Map();
      }

      _cellKey(x, y) {
        const cx = Math.floor(x / this.cellSize);
        const cy = Math.floor(y / this.cellSize);
        return `${cx}:${cy}`;
      }

      _neighborsOf(x, y) {
        const cx = Math.floor(x / this.cellSize);
        const cy = Math.floor(y / this.cellSize);
        const found = [];
        for (let ox = -2; ox <= 2; ox++) {
          for (let oy = -2; oy <= 2; oy++) {
            const key = `${cx + ox}:${cy + oy}`;
            const entry = this.cellMap.get(key);
            if (entry) found.push(entry);
          }
        }
        return found;
      }

      _fitsHere(x, y) {
        if (x < 0 || x >= this.width || y < 0 || y >= this.height) return false;
        return this._neighborsOf(x, y).every(([nx, ny]) => {
          const dx = nx - x;
          const dy = ny - y;
          return (dx * dx + dy * dy) >= this.minDistance * this.minDistance;
        });
      }

      _place(x, y) {
        const point = [x, y];
        this.cellMap.set(this._cellKey(x, y), point);
        return point;
      }

      run() {
        const accepted = [];
        const frontier = [];

        const seed = this._place(Math.random() * this.width, Math.random() * this.height);
        accepted.push(seed);
        frontier.push(seed);

        while (frontier.length) {
          const pick = Math.floor(Math.random() * frontier.length);
          const [ox, oy] = frontier[pick];
          let placed = false;

          for (let attempt = 0; attempt < this.maxAttempts; attempt++) {
            const theta = Math.random() * Math.PI * 2;
            const radius = this.minDistance * (1 + Math.random());
            const px = ox + Math.cos(theta) * radius;
            const py = oy + Math.sin(theta) * radius;

            if (this._fitsHere(px, py)) {
              const point = this._place(px, py);
              accepted.push(point);
              frontier.push(point);
              placed = true;
              break;
            }
          }

          if (!placed) frontier.splice(pick, 1);
        }

        return accepted;
      }
    }

    // Reescala 'value' de [oldMin, oldMax] para [newMin, newMax].
    function remapValue(value, oldMin, oldMax, newMin, newMax) {
      const t = (value - oldMin) / (oldMax - oldMin);
      return newMin + t * (newMax - newMin);
    }

    /*
     * Função de ruído 3D usada para variar a posição, a forma e a cor das
     * partículas ao longo do tempo, criando o movimento orgânico do efeito.
     */
    const GLSL_NOISE = `
    float hashNoiseSeed(vec3 p) {
      p = fract(p * vec3(0.1031, 0.1030, 0.0973));
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }

    float valueNoise3D(vec3 p) {
      vec3 cellId = floor(p);
      vec3 localPos = fract(p);
      vec3 curve = localPos * localPos * (3.0 - 2.0 * localPos);

      float corner000 = hashNoiseSeed(cellId + vec3(0.0, 0.0, 0.0));
      float corner100 = hashNoiseSeed(cellId + vec3(1.0, 0.0, 0.0));
      float corner010 = hashNoiseSeed(cellId + vec3(0.0, 1.0, 0.0));
      float corner110 = hashNoiseSeed(cellId + vec3(1.0, 1.0, 0.0));
      float corner001 = hashNoiseSeed(cellId + vec3(0.0, 0.0, 1.0));
      float corner101 = hashNoiseSeed(cellId + vec3(1.0, 0.0, 1.0));
      float corner011 = hashNoiseSeed(cellId + vec3(0.0, 1.0, 1.0));
      float corner111 = hashNoiseSeed(cellId + vec3(1.0, 1.0, 1.0));

      float edgeX00 = mix(corner000, corner100, curve.x);
      float edgeX10 = mix(corner010, corner110, curve.x);
      float edgeX01 = mix(corner001, corner101, curve.x);
      float edgeX11 = mix(corner011, corner111, curve.x);

      float faceY0 = mix(edgeX00, edgeX10, curve.y);
      float faceY1 = mix(edgeX01, edgeX11, curve.y);

      float sample3D = mix(faceY0, faceY1, curve.z);

      return sample3D * 2.0 - 1.0;
    }
    `;

    // Shader de simulação: roda num quad de tela cheia e escreve a próxima
    // posição/escala/velocidade de cada partícula numa render target.
    const SIM_VERTEX = `
      void main() {
        gl_Position = vec4(position, 1.0);
      }
    `;

    function createSimulationShader(gridSize) {
      return `
        precision highp float;
        uniform sampler2D uStateMap;
        uniform sampler2D uOriginMap;
        uniform vec2 uPulseCenter;
        uniform float uElapsedTime;
        uniform float uDeltaTime;
        uniform float uPulseRadius;
        uniform float uPulseBandWidth;
        uniform float uPulseBandWidthInner;
        uniform float uPulseDisplaceStrength;

        ${GLSL_NOISE}

        vec2 wanderOffset(vec2 originPos, float t) {
          float driftNoiseX = valueNoise3D(vec3(originPos * 4.0 + vec2(88.494, 32.4397), t * 0.35));
          float driftNoiseY = valueNoise3D(vec3(originPos * 4.0 + vec2(50.904, 120.947), t * 0.35));
          float fineNoiseX  = valueNoise3D(vec3(originPos * 20.0 + vec2(18.4924, 72.9744), t * 0.5));
          float fineNoiseY  = valueNoise3D(vec3(originPos * 20.0 + vec2(50.904, 120.947), t * 0.5));

          vec2 drift = vec2(driftNoiseX, driftNoiseY) * 0.03;
          drift += vec2(fineNoiseX, fineNoiseY) * 0.005;
          return drift;
        }

        float pulseMask(vec2 originPos, float pulseDist, float pulseDistJittered, float bandCore) {
          float bandOuter = smoothstep(uPulseRadius - (uPulseBandWidth * 2.0), uPulseRadius, pulseDist)
                           - smoothstep(uPulseRadius, uPulseRadius + uPulseBandWidth, pulseDistJittered);
          bandOuter = pow(bandOuter, 2.0);
          return bandOuter;
        }

        void main() {
          vec2 texelUV = gl_FragCoord.xy / vec2(${gridSize.toFixed(1)}, ${gridSize.toFixed(1)});
          vec4 stateSample = texture2D(uStateMap, texelUV);

          float pointScale = stateSample.z;
          float pointVelocity = stateSample.w;
          vec2 originPos = texture2D(uOriginMap, texelUV).xy;

          float t = uElapsedTime * 0.5;
          vec2 offsetPos = stateSample.xy * 0.8;

          float pulseDist = distance(originPos, uPulseCenter);
          float jitterNoise = valueNoise3D(vec3(originPos * 0.2 + vec2(18.4924, 72.9744), t * 0.5));
          float pulseDistJittered = distance(originPos + (jitterNoise * 0.005), uPulseCenter);

          float bandInner = smoothstep(uPulseRadius - (uPulseBandWidthInner * 2.0), uPulseRadius, pulseDist)
                           - smoothstep(uPulseRadius, uPulseRadius + uPulseBandWidthInner, pulseDistJittered);
          bandInner = pow(bandInner, 3.0);

          float bandCore = smoothstep(uPulseRadius + uPulseBandWidthInner, uPulseRadius, pulseDist);

          float intensity = pulseMask(originPos, pulseDist, pulseDistJittered, bandCore);
          intensity += bandInner * 3.0;
          intensity += bandCore * 0.4;
          intensity += valueNoise3D(vec3(originPos * 30.0 + vec2(11.4924, 12.9744), t * 0.5)) * bandCore * 0.5;

          float radialNoise = valueNoise3D(vec3(originPos * 2.0 + vec2(18.4924, 72.9744), t * 0.5));
          intensity += pow((radialNoise + 1.5) * 0.5, 2.0) * 0.12;

          vec2 drift = wanderOffset(originPos, t);
          drift.x += sin((originPos.x * 20.0) + (t * 4.0)) * 0.02 * clamp(pulseDist, 0.0, 1.0);
          drift.y += cos((originPos.y * 20.0) + (t * 3.0)) * 0.02 * clamp(pulseDist, 0.0, 1.0);

          offsetPos -= (uPulseCenter - (originPos + drift)) * pow(bandInner, 0.75) * uPulseDisplaceStrength;

          pointScale += (intensity - pointScale) * 0.2;

          vec2 nextPos = originPos + drift + (offsetPos * 0.25);

          pointVelocity = pointVelocity * 0.5 + pointScale * 0.25;

          gl_FragColor = vec4(nextPos, pointScale, pointVelocity);
        }
      `;
    }

    // Shader de render: cada partícula vira um quadrado arredondado com
    // gradiente de cor entre três tons e leve rotação orientada pelo ruído.
    const RENDER_VERTEX = `
      precision highp float;
      attribute vec4 randomSeeds;

      uniform sampler2D uStateMap;
      uniform float uPointSizeFactor;
      uniform float uDevicePixelRatio;

      varying vec4 vRandomSeeds;
      varying float vPointVelocity;
      varying vec2 vWorldPos;
      varying vec2 vClipPos;
      varying float vPointScale;

      void main() {
        vec4 stateSample = texture2D(uStateMap, uv);
        vRandomSeeds = randomSeeds;
        vPointVelocity = stateSample.w;
        vPointScale = stateSample.z;
        vWorldPos = stateSample.xy;

        vec4 viewSpace = modelViewMatrix * vec4(vWorldPos, 0.0, 1.0);
        gl_Position = projectionMatrix * viewSpace;
        vClipPos = gl_Position.xy;

        gl_PointSize = vPointScale * 7.0 * uDevicePixelRatio * 0.5 * uPointSizeFactor;
      }
    `;

    const RENDER_FRAGMENT = `
      precision highp float;

      varying vec4 vRandomSeeds;
      varying vec2 vClipPos;
      varying vec2 vWorldPos;
      varying float vPointScale;
      varying float vPointVelocity;

      uniform vec3 uPaletteA;
      uniform vec3 uPaletteB;
      uniform vec3 uPaletteC;
      uniform vec2 uPulseCenter;
      uniform vec2 uResolution;
      uniform float uOpacity;
      uniform float uElapsedTime;
      uniform int uPaletteMode;

      ${GLSL_NOISE}

      float roundedBoxSDF(in vec2 p, in vec2 halfSize, in vec4 cornerRadius) {
        cornerRadius.xy = (p.x > 0.0) ? cornerRadius.xy : cornerRadius.zw;
        cornerRadius.x  = (p.y > 0.0) ? cornerRadius.x  : cornerRadius.y;
        vec2 q = abs(p) - halfSize + cornerRadius.x;
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - cornerRadius.x;
      }

      vec2 rotate2D(vec2 v, float angle) {
        float s = sin(angle);
        float c = cos(angle);
        return mat2(c, s, -s, c) * v;
      }

      vec3 tricolorGradient(float progress) {
        float split = 0.8;
        vec3 lowerHalf = mix(uPaletteA, uPaletteB, progress / split);
        vec3 upperHalf = mix(uPaletteB, uPaletteC, (progress - split) / (1.0 - split));
        return mix(lowerHalf, upperHalf, step(split, progress));
      }

      void main() {
        const float edgeSoftness = 0.2;
        float aspect = uResolution.x / uResolution.y;

        float spinNoise = valueNoise3D(vec3(vWorldPos * 10.0 + vec2(18.4924, 72.9744), uElapsedTime * 0.85));
        float tintNoise = valueNoise3D(vec3(vWorldPos * 2.0 + vec2(74.664, 91.556), uElapsedTime * 0.5));
        tintNoise = tintNoise * 0.5 + 0.5;

        float pulseAngle = atan(vWorldPos.y - uPulseCenter.y, vWorldPos.x - uPulseCenter.x);

        vec2 pointUV = gl_PointCoord.xy - vec2(0.5);
        pointUV.y = -pointUV.y;
        pointUV = rotate2D(pointUV, spinNoise * 0.5 - pulseAngle);

        float colorProgress = smoothstep(0.0, 0.75, pow(tintNoise, 2.0));
        vec3 particleColor = tricolorGradient(colorProgress);

        float edgeDist = length(pointUV);
        float baseRadius = 0.5;
        float edgeMask = clamp(smoothstep(baseRadius + edgeSoftness + 0.0001, baseRadius - edgeSoftness, edgeDist), 0.0, 1.0);

        float shapeMask = smoothstep(0.1, 0.0, roundedBoxSDF(pointUV, vec2(0.5, 0.2), vec4(0.25)));

        float pointAlpha = uOpacity * shapeMask * smoothstep(0.1, 0.2, vPointScale);
        if (pointAlpha < 0.01) discard;

        particleColor = clamp(particleColor, 0.0, 1.0);
        particleColor = mix(particleColor, particleColor * clamp(vPointVelocity, 0.0, 1.0), float(uPaletteMode));

        gl_FragColor = vec4(particleColor, clamp(pointAlpha, 0.0, 1.0));
      }
    `;

    /*
     * Sistema de partículas: simula a posição, a escala e a velocidade de
     * milhares de pontos a cada frame e desenha o resultado na tela, dentro
     * de um container específico (fundo transparente, para sobrepor o dark bg).
     */
    class ParticleSystem {
      static DEFAULTS = {
        density: 170,
        pointSizeFactor: 0.75,
        pulseBandWidth: 0.15,
        pulseBandWidthInner: 0.05,
        pulseDisplaceStrength: 0.15,
        paletteMode: 0, // 0 = mantém as cores cheias (branco/cinza) sobre fundo escuro
        gridResolution: 220,
        sampleArea: 460,
        scatterAttempts: 20,
        colors: {
          a: '#e6e6e6', // cinza quase branco
          b: '#ffffff', // branco
          c: '#3a3a3a', // cinza escuro
        },
      };

      constructor(container, options = {}) {
        this.container = container;
        Object.assign(this, ParticleSystem.DEFAULTS, options);
        this.colors = Object.assign({}, ParticleSystem.DEFAULTS.colors, options.colors || {});
        this.palette = {
          a: new THREE.Color(this.colors.a),
          b: new THREE.Color(this.colors.b),
          c: new THREE.Color(this.colors.c),
        };

        this.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        this.frameClock = new THREE.Clock();
        this.elapsedTime = 0;
        this.previousElapsedTime = 0;
        this.pulseCenter = new THREE.Vector2(0, 0);
        this.pointerTarget = new THREE.Vector2(0, 0);
        this.pointerNDC = new THREE.Vector2(10, 10); // fora da tela até o usuário mover
        this.pointerInsideContainer = false;
        this.pointerActive = false;
        this.pointerWorldPoint = new THREE.Vector3();
        this.hasSimulatedOnce = false;
        this.running = false;
        this.animationId = null;

        this._buildRenderer();
        this._buildCamera();
        this._buildScene();
        this._buildParticleData();
        this._buildSimulationPass();
        this._buildPointsMesh();
        this._bindEvents();

        this.renderFrame = this.renderFrame.bind(this);
      }

      _buildRenderer() {
        this.canvas = document.createElement('canvas');
        this.container.appendChild(this.canvas);
        this.renderer = new THREE.WebGLRenderer({
          canvas: this.canvas,
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance',
          precision: 'highp',
        });
        this.renderer.setClearColor(0x000000, 0);
        this.handleResize();
        this.renderer.setPixelRatio(this.devicePixelRatio);
      }

      _buildCamera() {
        const aspect = this.canvas.clientWidth / this.canvas.clientHeight;
        this.camera = new THREE.PerspectiveCamera(40, aspect, 0.1, 1000);
        this.camera.position.z = 3.1;
      }

      _buildScene() {
        this.scene = new THREE.Scene();
        this.pointerPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(12.5, 12.5),
          new THREE.MeshBasicMaterial({ visible: false })
        );
        this.scene.add(this.pointerPlane);
        this.pointerRaycaster = new THREE.Raycaster();
      }

      _buildParticleData() {
        const area = this.sampleArea;
        const minDistance = remapValue(this.density, 0, 300, 10, 2);
        const cloud = new ScatterPointGenerator(area, area, minDistance, this.scatterAttempts).run();

        this.texelCount = this.gridResolution * this.gridResolution;
        this.seedPositions = [];
        const half = area / 2;
        for (let i = 0; i < cloud.length && i < this.texelCount; i++) {
          this.seedPositions.push(cloud[i][0] - half, cloud[i][1] - half);
        }
        this.particleCount = this.seedPositions.length / 2;

        const originArray = new Float32Array(this.texelCount * 4);
        for (let i = 0; i < this.particleCount; i++) {
          const base = i * 4;
          originArray[base] = this.seedPositions[i * 2] / half;
          originArray[base + 1] = this.seedPositions[i * 2 + 1] / half;
          originArray[base + 2] = 0;
          originArray[base + 3] = 0;
        }

        this.originTexture = new THREE.DataTexture(
          originArray, this.gridResolution, this.gridResolution, THREE.RGBAFormat, THREE.FloatType
        );
        this.originTexture.needsUpdate = true;
      }

      _buildSimulationPass() {
        const bufferOptions = {
          wrapS: THREE.ClampToEdgeWrapping,
          wrapT: THREE.ClampToEdgeWrapping,
          minFilter: THREE.NearestFilter,
          magFilter: THREE.NearestFilter,
          format: THREE.RGBAFormat,
          type: THREE.FloatType,
          depthBuffer: false,
          stencilBuffer: false,
        };
        this.simBufferA = new THREE.WebGLRenderTarget(this.gridResolution, this.gridResolution, bufferOptions);
        this.simBufferB = new THREE.WebGLRenderTarget(this.gridResolution, this.gridResolution, bufferOptions);

        this.simPassScene = new THREE.Scene();
        this.simPassCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        this.simPassMaterial = new THREE.ShaderMaterial({
          uniforms: {
            uStateMap: { value: this.originTexture },
            uOriginMap: { value: this.originTexture },
            uPulseCenter: { value: new THREE.Vector2(0, 0) },
            uPulseRadius: { value: 0.2 },
            uDeltaTime: { value: 0 },
            uPulseBandWidth: { value: this.pulseBandWidth },
            uPulseBandWidthInner: { value: this.pulseBandWidthInner },
            uPulseDisplaceStrength: { value: this.pulseDisplaceStrength },
            uElapsedTime: { value: 0 },
          },
          vertexShader: SIM_VERTEX,
          fragmentShader: createSimulationShader(this.gridResolution),
        });

        const fullScreenQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), this.simPassMaterial);
        this.simPassScene.add(fullScreenQuad);
      }

      _buildPointsMesh() {
        const geometry = new THREE.BufferGeometry();
        const uv = new Float32Array(this.particleCount * 2);
        const positions = new Float32Array(this.particleCount * 3);
        const randomSeeds = new Float32Array(this.particleCount * 4);

        for (let i = 0; i < this.particleCount; i++) {
          const gx = i % this.gridResolution;
          const gy = Math.floor(i / this.gridResolution);
          uv[i * 2] = gx / this.gridResolution;
          uv[i * 2 + 1] = gy / this.gridResolution;
          randomSeeds[i * 4] = Math.random();
          randomSeeds[i * 4 + 1] = Math.random();
          randomSeeds[i * 4 + 2] = Math.random();
          randomSeeds[i * 4 + 3] = Math.random();
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
        geometry.setAttribute('randomSeeds', new THREE.BufferAttribute(randomSeeds, 4));

        this.pointSizePixels = this._computePointSizePixels();

        this.pointsMaterial = new THREE.ShaderMaterial({
          uniforms: {
            uStateMap: { value: this.originTexture },
            uElapsedTime: { value: 0 },
            uPaletteA: { value: this.palette.a },
            uPaletteB: { value: this.palette.b },
            uPaletteC: { value: this.palette.c },
            uOpacity: { value: 1 },
            uPulseCenter: { value: new THREE.Vector2(0, 0) },
            uResolution: { value: new THREE.Vector2(this.canvas.clientWidth, this.canvas.clientHeight) },
            uPointSizeFactor: { value: this.pointSizePixels },
            uDevicePixelRatio: { value: this.devicePixelRatio },
            uPaletteMode: { value: this.paletteMode },
          },
          vertexShader: RENDER_VERTEX,
          fragmentShader: RENDER_FRAGMENT,
          transparent: true,
          depthTest: false,
          depthWrite: false,
        });

        this.particlePoints = new THREE.Points(geometry, this.pointsMaterial);
        this.particlePoints.scale.set(5, 5, 5);
        this.scene.add(this.particlePoints);
      }

      _computePointSizePixels() {
        return (this.canvas.clientWidth / this.devicePixelRatio / 2000) * this.pointSizeFactor;
      }

      _bindEvents() {
        let resizeTimer = null;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => this.handleResize(), 150);
        });

        // Coordenadas do ponteiro relativas a ESTE container (não à janela
        // inteira), para que cada instância reaja só quando o mouse está
        // sobre a sua própria seção.
        const trackPointer = (clientX, clientY) => {
          const rect = this.container.getBoundingClientRect();
          this.pointerInsideContainer = (
            clientX >= rect.left && clientX <= rect.right &&
            clientY >= rect.top && clientY <= rect.bottom
          );
          this.pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          this.pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        };

        window.addEventListener('mousemove', (e) => trackPointer(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
          if (e.touches.length > 0) trackPointer(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
      }

      handleResize() {
        const w = this.container.clientWidth;
        const h = this.container.clientHeight;
        if (!w || !h) return;
        this.canvas.width = w;
        this.canvas.height = h;
        this.renderer.setSize(w, h, false);

        if (this.camera) {
          this.camera.aspect = w / h;
          this.camera.updateProjectionMatrix();
        }
        if (this.pointsMaterial) {
          this.pointsMaterial.uniforms.uResolution.value.set(w, h);
        }
      }

      _updatePointerTarget() {
        const wanderX = Math.sin(this.elapsedTime * 0.66 + 94.234) * 0.2;
        const wanderY = Math.cos(this.elapsedTime * 0.75 + 21.028) * 0.1;
        this.pointerTarget.set(wanderX, wanderY);

        this.pointerRaycaster.setFromCamera(this.pointerNDC, this.camera);
        const hits = this.pointerRaycaster.intersectObject(this.pointerPlane);
        this.pointerActive = this.pointerInsideContainer && hits.length > 0;

        if (this.pointerActive) {
          this.pointerWorldPoint.copy(hits[0].point);
          this.pointerTarget.set(
            this.pointerWorldPoint.x * 0.175 + wanderX * 0.5,
            this.pointerWorldPoint.y * 0.175 + wanderY * 0.5
          );
        }

        const easing = this.pointerActive ? 0.02 : 0.01;
        this.pulseCenter.lerp(this.pointerTarget, easing);
      }

      stepSimulation(dt) {
        this._updatePointerTarget();
        this.pointSizePixels = this._computePointSizePixels();

        const elapsed = this.frameClock.getElapsedTime();
        const sim = this.simPassMaterial.uniforms;
        sim.uStateMap.value = this.hasSimulatedOnce ? this.simBufferA.texture : this.originTexture;
        sim.uElapsedTime.value = elapsed;
        sim.uDeltaTime.value = dt;
        sim.uPulseRadius.value = 0.175 + Math.sin(this.elapsedTime) * 0.03 + Math.cos(this.elapsedTime * 3) * 0.02;
        sim.uPulseCenter.value = this.pulseCenter;
        sim.uPulseBandWidth.value = this.pulseBandWidth;
        sim.uPulseBandWidthInner.value = this.pulseBandWidthInner;
        sim.uPulseDisplaceStrength.value = this.pulseDisplaceStrength;

        this.renderer.setRenderTarget(this.simBufferB);
        this.renderer.render(this.simPassScene, this.simPassCamera);
        this.renderer.setRenderTarget(null);

        const pts = this.pointsMaterial.uniforms;
        pts.uStateMap.value = this.hasSimulatedOnce ? this.simBufferB.texture : this.originTexture;
        pts.uElapsedTime.value = elapsed;
        pts.uPulseCenter.value = this.pulseCenter;
        pts.uPointSizeFactor.value = this.pointSizePixels;

        [this.simBufferA, this.simBufferB] = [this.simBufferB, this.simBufferA];
        this.hasSimulatedOnce = true;
      }

      renderFrame() {
        if (!this.running) return;
        this.animationId = requestAnimationFrame(this.renderFrame);

        const now = this.frameClock.getElapsedTime();
        const dt = now - this.previousElapsedTime;
        this.previousElapsedTime = now;
        this.elapsedTime += dt;

        this.stepSimulation(dt);

        this.renderer.setRenderTarget(null);
        this.renderer.autoClear = false;
        this.renderer.clear();
        this.renderer.render(this.scene, this.camera);
      }

      start() {
        if (this.running) return;
        this.running = true;
        this.previousElapsedTime = this.frameClock.getElapsedTime();
        this.renderFrame();
      }

      stop() {
        this.running = false;
        if (this.animationId) cancelAnimationFrame(this.animationId);
      }
    }

    // Cria uma instância do campo de partículas dentro de um container, só
    // rodando a animação enquanto a seção correspondente está visível.
    function initOrganicParticles(containerId, sectionSelector, overrides) {
      const container = document.getElementById(containerId);
      if (!container || typeof THREE === 'undefined') return null;

      const system = new ParticleSystem(container, overrides || {});

      const section = document.querySelector(sectionSelector);
      if ('IntersectionObserver' in window && section) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) system.start();
            else system.stop();
          });
        }, { threshold: 0.05 });
        observer.observe(section);
      } else {
        system.start();
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) system.stop();
        else if (!section || section.getBoundingClientRect().top < window.innerHeight) system.start();
      });

      return system;
    }

    initOrganicParticles('heroDots', '.hero-bg', {
      density: 170,
      gridResolution: 220,
      sampleArea: 460,
    });

    // ===== Campo de email =====
    (function () {
      const input = document.getElementById('emailInput');
      const btn = document.getElementById('continueBtn');
      const hint = document.getElementById('emailHint');

      setTimeout(() => input.focus(), 900);

      function setHint(message, kind) {
        hint.textContent = message || '';
        hint.className = message ? 'auth-hint show ' + kind : 'auth-hint';
      }

      function isValidEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      }

      input.addEventListener('input', () => {
        btn.classList.remove('show', 'active');
        setHint('', '');
        if (isValidEmail(input.value.trim())) {
          btn.classList.add('show', 'active');
        }
      });

      async function submitEmail() {
        const email = input.value.trim();
        if (!btn.classList.contains('active') || !isValidEmail(email)) return;

        setHint('Enviando...', 'ok');
        input.disabled = true;
        btn.classList.remove('active');

        try {
          const payload = { email };
          if (window.turnstileToken) {
            payload.turnstileToken = window.turnstileToken;
          }
          const res = await fetch('/api/auth/request-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          
          if (!res.ok) throw new Error(data.error || 'Erro ao processar a solicitação');

          sessionStorage.setItem('minsq_verify_email', email);
          if (data.isNewUser) sessionStorage.setItem('minsq_is_new_user', 'true');
          else sessionStorage.removeItem('minsq_is_new_user');
          
          if (window.top !== window) {
            window.top.postMessage({ type: 'MINSQ_NAVIGATE', url: '/pages/auth/confirm-account.html' }, window.location.origin);
          } else {
            window.location.replace('confirm-account.html');
          }
        } catch (err) {
          input.disabled = false;
          btn.classList.add('active');
          setHint(err.message || 'Erro ao processar a solicitação.', 'error');
          if (window.turnstile && window.turnstileWidgetId) {
            turnstile.reset(window.turnstileWidgetId); // Reseta o CAPTCHA se houver erro
            window.turnstileToken = null;
          }
        }
      }

      btn.addEventListener('click', submitEmail);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitEmail();
      });

      // Inicializa o Turnstile de forma dinâmica
      async function initTurnstile() {
        try {
          const res = await fetch('/api/auth/turnstile-key');
          const data = await res.json();
          if (data.siteKey) {
            const script = document.createElement('script');
            script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);

            script.onload = () => {
              const tsContainer = document.getElementById('turnstile-container');
              if (tsContainer && window.turnstile) {
                // Deixa o container visível só pra comportar o widget se necessário
                tsContainer.style.display = 'flex';
                window.turnstileWidgetId = turnstile.render('#turnstile-container', {
                  sitekey: data.siteKey,
                  callback: function(token) {
                    window.turnstileToken = token;
                  },
                  'error-callback': function() {
                    setHint('Falha na validação de segurança. Recarregue a página.', 'error');
                  }
                });
              }
            };
          }
        } catch(e) {
          console.warn('[Turnstile] Erro ao carregar Site Key', e);
        }
      }
      initTurnstile();
    })();

    // ===== Login com Google =====
    async function handleGoogleOtc(otc) {
      try {
        const res = await fetch(`/api/auth/verify-otc`, {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ otc })
        });
        const data = await res.json();
        if (data.pendingAuth && data.onboardingToken) {
          sessionStorage.setItem('minsq_onboarding_token', data.onboardingToken);
          if (window.parent && window.parent.postMessage) {
            window.parent.postMessage({ type: 'MINSQ_ONBOARDING_START', token: data.onboardingToken }, window.location.origin);
          }
          if (window.top !== window) {
            window.top.postMessage({ type: 'MINSQ_NAVIGATE', url: '/pages/auth/onboarding.html' }, window.location.origin);
          } else {
            window.location.replace('onboarding.html');
          }
          return;
        }
        if (data.token) {
          if (window === window.top) {
            // Limpa cache de personalização da conta anterior (chaves sem prefixo de usuário)
            const _pageKeys = ['dashboard','today','goals','finance','health','study','foco','notes','analytics','profile'];
            _pageKeys.forEach(k => { localStorage.removeItem(k+'BgImage'); localStorage.removeItem(k+'BgOpacity'); localStorage.removeItem(k+'Font'); });
            localStorage.removeItem('dc_sb_pref');
            localStorage.removeItem('minsq_auth_user');
            localStorage.setItem('minsq_token', data.token);
            if (data.user) localStorage.setItem('minsq_auth_user', JSON.stringify(data.user));
            var nURL = data.isNewUser ? '/pages/auth/onboarding.html' : '/pages/dashboard.html';
            if (window.top !== window) {
              window.top.postMessage({ type: 'MINSQ_NAVIGATE', url: nURL }, window.location.origin);
            } else {
              window.location.replace(nURL);
            }
          } else {
            window.top.postMessage({ type: 'GOOGLE_SET_TOKEN', token: data.token, user: data.user, isNewUser: data.isNewUser }, window.location.origin);
          }
        } else {
          alert('Falha ao autenticar com o Google. Tente novamente.');
        }
      } catch (e) {
        alert('Erro de conexão ao autenticar com o Google.');
      }
    }

    window.addEventListener('storage', (e) => {
      // Se estiver rodando dentro do shell (index.html), deixa ele gerenciar o login
      if (window !== window.top) return;

      if (e.key === 'minsq_google_otc' && e.newValue) {
        localStorage.removeItem('minsq_google_otc');
        handleGoogleOtc(e.newValue);
      }
    });

    document.getElementById('googleBtn').addEventListener('click', () => {
      const width = 500;
      const height = 600;
      const left = window.screenX + (window.outerWidth - width) / 2;
      const top = window.screenY + (window.outerHeight - height) / 2;
      const popup = window.open('/api/auth/google', 'GoogleAuth', `width=${width},height=${height},left=${left},top=${top},toolbar=no,menubar=no`);

      if (!popup) {
        window.top.location.replace('/api/auth/google');
      }
    });

    // ===== Modal de Termos e Privacidade =====
    (function initLegalModal() {
      const modal = document.createElement('div');
      modal.className = 'legal-modal';
      modal.innerHTML = `
        <div class="legal-modal-content">
          <div class="legal-modal-header">
            <h3 class="legal-modal-header-title">Documento</h3>
            <button class="legal-modal-close" title="Fechar">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div class="legal-modal-layout">
            <div class="legal-modal-body">Carregando...</div>
            <div class="legal-modal-spy"><div class="spy-inner"></div></div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      const modalBody = modal.querySelector('.legal-modal-body');
      const modalClose = modal.querySelector('.legal-modal-close');
      const spyContainer = modal.querySelector('.legal-modal-spy');

      modalClose.addEventListener('click', () => {
        modal.classList.remove('show');
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('show');
      });

      let settingsDoc = null;

      function updateSpy() {
        const inner = spyContainer.querySelector('.spy-inner');
        if(inner) inner.innerHTML = '';
        const headings = modalBody.querySelectorAll('h3, h4');
        
        headings.forEach((h, index) => {
          h.id = 'legal-heading-' + index;
          
          const item = document.createElement('div');
          item.className = 'spy-item';
          item.innerHTML = `<div class="spy-dash"></div><div class="spy-label">${h.innerText}</div>`;
          
          item.addEventListener('click', () => {
            modalBody.scrollTo({
              top: h.offsetTop - modalBody.offsetTop,
              behavior: 'smooth'
            });
          });
          
          if(inner) inner.appendChild(item);
        });

        const handleScroll = () => {
          let currentActive = 0;
          for (let i = 0; i < headings.length; i++) {
            const h = headings[i];
            // Matemática consertada: como a box tem position:relative, h.offsetTop já é exato!
            if (h.offsetTop <= modalBody.scrollTop + 100) {
              currentActive = i;
            }
          }
          
          // Se chegou no final absoluto da rolagem, marca o último
          if (modalBody.scrollTop + modalBody.clientHeight >= modalBody.scrollHeight - 5) {
            currentActive = headings.length - 1;
          }
          
          const spyItems = spyContainer.querySelectorAll('.spy-item');
          spyItems.forEach((item, idx) => {
            if (idx === currentActive) {
              if (!item.classList.contains('active')) {
                item.classList.add('active');
                // Faz a barra lateral rolar sozinha para acompanhar a bolinha branca
                item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              }
            } else {
              item.classList.remove('active');
            }
          });
        };
        
        modalBody.addEventListener('scroll', handleScroll);
        // Trigger initial active state
        handleScroll();
      }

      async function openModal(type) {
        modal.classList.add('show');
        
        const titleEl = modal.querySelector('.legal-modal-header-title');
        if (titleEl) {
          titleEl.innerText = type === 'termos' ? 'Termos de Serviço' : 'Política de Privacidade';
        }

        if (!settingsDoc) {
          try {
            modalBody.innerHTML = 'Carregando...';
            spyContainer.innerHTML = '<div class="spy-inner"></div>';
            const response = await fetch('/pages/settings.html');
            if (!response.ok) throw new Error('Network error');
            const text = await response.text();
            const parser = new DOMParser();
            settingsDoc = parser.parseFromString(text, 'text/html');
          } catch (e) {
            modalBody.innerHTML = 'Erro ao carregar o conteúdo. Por favor, tente novamente.';
            return;
          }
        }

        const contentNode = settingsDoc.querySelector(`.sobre-view[data-sobre-view="${type}"] .legal-text`);
        if (contentNode) {
          modalBody.innerHTML = contentNode.outerHTML;
          setTimeout(updateSpy, 50); // slight delay to allow layout to settle
        } else {
          modalBody.innerHTML = 'Conteúdo não encontrado.';
          spyContainer.innerHTML = '<div class="spy-inner"></div>';
        }
      }

      document.querySelector('[data-modal="termos"]').addEventListener('click', (e) => {
        e.preventDefault();
        openModal('termos');
      });

      document.querySelector('[data-modal="privacidade"]').addEventListener('click', (e) => {
        e.preventDefault();
        openModal('privacidade');
      });
    })();
</script>
<script src="/pages/shared.js"></script>
</body>
