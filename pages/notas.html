<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <script>try { if (localStorage.getItem('minsq_is_maintenance') === 'true') { document.documentElement.style.display = 'none'; window.top.location.replace('/pages/api/maintenance.html'); } } catch (e) { }</script>
  <meta charset="UTF-8">
  <title>Balão Flutuante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .balao {
      width: 80vw;
      height: 98vh;
      background-color: #141414;
      border-radius: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      margin-right: calc(0.3vw + 3px);
    }

    /* ============================================================
     Tamanho, posição e forma do .balao permanecem exatamente como
     no original. Nenhum card novo foi criado: a sidebar é uma
     coluna solta no espaço livre à esquerda, e o editor vive
     dentro do próprio .balao.
     ============================================================ */

    * {
      font-family: 'Exo 2', sans-serif;
    }

    :root {
      --ink: #f0efec;
      --ink-dim: #9c9a94;
      --ink-faint: #5c5a55;
      --line: rgba(255, 255, 255, .08);
      --line-soft: rgba(255, 255, 255, .05);
      --surface: rgba(255, 255, 255, .045);
      --surface-hover: rgba(255, 255, 255, .08);
      --accent: #f2f2f0;
      --accent-ink: #161513;
      --danger: #c47a7a;
    }

    ::-webkit-scrollbar {
      width: 3px;
      height: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .14);
      border-radius: 2px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, .22);
    }

    ::selection {
      background: var(--accent);
      color: var(--accent-ink);
    }

    svg.ic {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ---------- SIDEBAR (fora do card, à esquerda) ---------- */
    .sidebar {
      flex: 1;
      min-width: 250px;
      max-width: 360px;
      height: 98vh;
      display: flex;
      flex-direction: column;
      padding: 36px 24px;
      color: var(--ink);
      overflow: hidden;
    }

    .sb-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .sb-title {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .sb-count {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-top: 6px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .sb-newbtn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity .15s, transform .1s;
    }

    .sb-newbtn svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.4;
    }

    .sb-newbtn:hover {
      opacity: .85;
    }

    .sb-newbtn:active {
      transform: scale(.94);
    }

    .sb-search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .sb-search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-faint);
    }

    .sb-search {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12.5px;
      padding: 10px 13px 10px 34px;
      border-radius: 10px;
      outline: none;
      transition: border-color .15s, background .15s;
    }

    .sb-search:focus {
      border-color: rgba(255, 255, 255, .28);
      background: rgba(255, 255, 255, .065);
    }

    .sb-search::placeholder {
      color: var(--ink-faint);
    }

    .sb-toolbar {
      display: flex;
      gap: 7px;
      margin-bottom: 14px;
    }

    .sb-tbtn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink-dim);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .2px;
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      user-select: none;
      transition: all .15s;
      white-space: nowrap;
    }

    .sb-tbtn:hover {
      color: var(--ink);
      border-color: rgba(255, 255, 255, .2);
      background: var(--surface-hover);
    }

    .sb-tbtn.on {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
      font-weight: 700;
    }

    .sb-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .sb-tagchip {
      font-size: 9.5px;
      font-weight: 500;
      color: var(--ink-dim);
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      transition: all .15s;
    }

    .sb-tagchip:hover {
      border-color: rgba(255, 255, 255, .22);
      color: var(--ink);
    }

    .sb-tagchip.on {
      background: var(--surface-hover);
      color: var(--ink);
      border-color: rgba(255, 255, 255, .3);
    }

    .sb-list {
      flex: 1;
      overflow-y: auto;
      margin: 8px -8px 0;
      padding: 2px 8px 8px;
    }

    .sb-item {
      padding: 12px 12px;
      border-radius: 11px;
      cursor: pointer;
      margin-bottom: 3px;
      transition: background .15s;
      position: relative;
      border: 1px solid transparent;
    }

    .sb-item:hover {
      background: var(--surface);
    }

    .sb-item.active {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, .14);
    }

    .sb-item.active::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: var(--ink);
      border-radius: 2px;
    }

    .sb-item-top {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      align-items: baseline;
    }

    .sb-item-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sb-pin {
      color: var(--ink-dim);
      flex-shrink: 0;
      display: flex;
    }

    .sb-pin svg {
      width: 11px;
      height: 11px;
    }

    .sb-item-snip {
      font-size: 11px;
      color: var(--ink-dim);
      margin-top: 4px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .sb-item-meta {
      font-size: 9px;
      color: var(--ink-faint);
      margin-top: 7px;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .sb-trash-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px 12px;
      font-size: 9.5px;
      color: var(--ink-faint);
      gap: 8px;
    }

    .sb-trash-row span {
      line-height: 1.4;
    }

    .sb-trash-row button {
      background: none;
      border: 1px solid var(--line);
      color: var(--ink-dim);
      font-size: 9px;
      padding: 5px 8px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .15s;
    }

    .sb-trash-row button:hover {
      color: var(--danger);
      border-color: rgba(196, 122, 122, .4);
    }

    .sb-empty {
      padding: 24px 10px;
      color: var(--ink-faint);
      font-size: 11px;
      text-align: center;
    }

    .sb-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .sb-actbtn {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--ink-faint);
      cursor: pointer;
      border-radius: 6px;
      transition: all .15s;
    }

    .sb-actbtn svg {
      width: 12px;
      height: 12px;
    }

    .sb-actbtn:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, .1);
    }

    .sb-actbtn.restore:hover {
      color: #9fc79f;
    }

    .sb-actbtn.purge:hover {
      color: var(--danger);
    }

    /* ---------- EDITOR (dentro do .balao) ---------- */
    .balao {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .ed-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 44px;
      border-bottom: 1px solid var(--line-soft);
      flex-shrink: 0;
    }

    .ed-idx {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--ink-faint);
    }

    .ed-actions {
      display: flex;
      gap: 8px;
    }

    .ed-abtn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .ed-abtn svg {
      width: 14px;
      height: 14px;
    }

    .ed-abtn:hover {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, .2);
      color: var(--ink);
    }

    .ed-abtn.pinned {
      color: var(--ink);
      border-color: rgba(255, 255, 255, .28);
      background: var(--surface-hover);
    }

    .ed-abtn.pinned svg {
      fill: currentColor;
    }

    .ed-abtn.danger:hover {
      color: var(--danger);
      border-color: rgba(196, 122, 122, .4);
    }

    .ed-header {
      padding: 26px 44px 0px;
      flex-shrink: 0;
    }

    .ed-body-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 44px 20px;
    }

    .ed-title {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--ink);
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -.6px;
      margin-bottom: 10px;
    }

    .ed-title::placeholder {
      color: var(--ink-faint);
    }

    .ed-sub {
      font-size: 10.5px;
      color: var(--ink-faint);
      letter-spacing: .4px;
      margin-bottom: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .ed-sub span:not(:last-child)::after {
      content: '·';
      margin-left: 12px;
      color: var(--ink-faint);
    }

    .ed-tagbar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      margin-bottom: 22px;
    }

    .ed-tag {
      font-size: 10px;
      font-weight: 500;
      color: var(--ink-dim);
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 5px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .ed-tag .x {
      cursor: pointer;
      color: var(--ink-faint);
      display: flex;
    }

    .ed-tag .x svg {
      width: 9px;
      height: 9px;
    }

    .ed-tag .x:hover {
      color: var(--danger);
    }

    .ed-tag-add {
      font-size: 10px;
      color: var(--ink-dim);
      border: 1px dashed var(--line);
      padding: 5px 10px;
      background: transparent;
      outline: none;
      width: 90px;
      border-radius: 20px;
    }

    .ed-tag-add:focus {
      border-color: rgba(255, 255, 255, .28);
    }

    .ed-tag-add::placeholder {
      color: var(--ink-faint);
    }

    .ed-divider {
      height: 1px;
      background: var(--line-soft);
      margin-bottom: 22px;
    }

    .ed-textbody {
      width: 100%;
      min-height: 260px;
      background: transparent;
      border: none;
      outline: none;
      color: #cfcdc7;
      font-size: 15px;
      line-height: 1.85;
      overflow-y: auto;
    }

    .ed-textbody:empty:before {
      content: attr(placeholder);
      color: var(--ink-faint);
      pointer-events: none;
      display: block;
    }
    
    .ed-textbody h1 { font-size: 24px; font-weight: 700; margin: 16px 0 8px; color: var(--ink); }
    .ed-textbody h2 { font-size: 20px; font-weight: 700; margin: 14px 0 8px; color: var(--ink); }
    .ed-textbody h3 { font-size: 16px; font-weight: 600; margin: 12px 0 8px; color: var(--ink); }
    .ed-textbody blockquote { border-left: 3px solid var(--accent); padding-left: 12px; margin: 12px 0; color: var(--ink-dim); font-style: italic; }
    .ed-textbody ul, .ed-textbody ol { padding-left: 24px; margin: 8px 0; }
    .ed-textbody li { margin-bottom: 4px; }
    .ed-textbody p { margin-bottom: 8px; }

    .ed-textbody input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      width: 16px; height: 16px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 4px;
      cursor: pointer;
      vertical-align: text-bottom;
      position: relative;
      margin-right: 8px;
    }
    .ed-textbody input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .ed-textbody input[type="checkbox"]:checked::after {
      content: '';
      position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
      border: solid var(--accent-ink); border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .ed-footer {
      flex-shrink: 0;
      padding: 16px 44px;
      border-top: 1px solid var(--line-soft);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--ink-faint);
      letter-spacing: .4px;
    }

    .ed-saved {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .ed-savedot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #8fbf8f;
      transition: background .2s;
    }

    .ed-savedot.saving {
      background: var(--ink-dim);
    }

    .ed-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--ink-faint);
      gap: 10px;
      text-align: center;
    }

    .ed-empty div:first-child {
      font-size: 13px;
      color: var(--ink-dim);
    }

    .ed-empty .sub {
      font-size: 10px;
      letter-spacing: .6px;
      color: var(--ink-faint);
      text-transform: uppercase;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #1e1e1e;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 12.5px;
      padding: 11px 18px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      transition: all .2s;
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .toast button {
      background: none;
      border: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
    }

    /* modal */
    .modal-ov {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .78);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
    }

    .modal-ov.open {
      display: flex;
    }

    .modal-box {
      background: #191919;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px 28px;
      max-width: 380px;
      text-align: center;
      color: var(--ink);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
    }

    .modal-box h3 {
      font-size: 15px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .modal-box p {
      font-size: 12.5px;
      color: var(--ink-dim);
      line-height: 1.55;
      margin-bottom: 22px;
    }

    .modal-btns {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .modal-btns button {
      padding: 9px 18px;
      border-radius: 9px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity .15s;
    }

    .modal-btns button:hover {
      opacity: .85;
    }

    .mb-cancel {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-dim);
    }

    .mb-confirm {
      background: var(--accent);
      border: none;
      color: var(--accent-ink);
    }

    .mb-confirm.danger {
      background: #b25a5a;
      color: #fff;
    }

    .import-input {
      display: none;
    }

    /* ---- slash menu ---- */
    .slash-menu {
      position: absolute;
      background: #191919;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 400;
      box-shadow: 0 15px 40px rgba(0,0,0,.6);
      width: 220px;
    }
    .slash-menu.show {
      display: flex;
    }
    .slash-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--ink);
      font-size: 12.5px;
      cursor: pointer;
      transition: background .15s;
    }
    .slash-item:hover, .slash-item.active {
      background: var(--surface-hover);
    }
    .slash-item.format-active {
      background: rgba(255, 255, 255, 0.12);
      font-weight: 700;
      color: #fff;
    }
    .slash-item.format-active svg {
      color: #fff;
    }
    .slash-item svg {
      width: 16px;
      height: 16px;
      color: var(--ink-faint);
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <div class="sb-header">
      <div>
        <div class="sb-title">Notas</div>
        <div class="sb-count" id="sbCount">0</div>
      </div>
      <button class="sb-newbtn" id="sbNewBtn" title="Nova nota" data-mh-help="Nova Nota: Clique aqui para iniciar um novo rascunho ou caderno de estudos instantaneamente.">
        <svg class="ic" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
    </div>

    <div class="sb-search-wrap">
      <svg class="ic" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input class="sb-search" id="sbSearch" type="text" placeholder="Buscar…" maxlength="30" data-mh-help="Busca Rápida: Digite qualquer palavra do título ou o nome de uma tag (ex: escola) para filtrar e encontrar sua anotação rapidamente.">
    </div>

    <div class="sb-toolbar">
      <button class="sb-tbtn" id="sbSortBtn" data-mh-help="Ordenação e Filtro: Organize a exibição das suas notas entre Recentes, Ordem Alfabética ou Data de Criação.">
        <svg class="ic" viewBox="0 0 24 24">
          <path d="M3 6h18M6 12h12M10 18h4" />
        </svg>
        <span id="sbSortLabel">Recentes</span>
      </button>
      <button class="sb-tbtn" id="sbTrashBtn" data-mh-help="Lixeira: Apagou algo sem querer? Você tem 30 dias para recuperar suas anotações antes que sumam para sempre.">
        <svg class="ic" viewBox="0 0 24 24">
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" />
        </svg>
        <span id="sbTrashLabel">Lixeira</span>
      </button>
      <button class="sb-tbtn" id="sbImportBtn" data-mh-help="Importar: Traga seus cadernos em Markdown de outros aplicativos e continue editando direto no Minsq.">
        <svg class="ic" viewBox="0 0 24 24">
          <path d="M12 3v12M7 8l5-5 5 5M4 21h16" />
        </svg>
        Importar
      </button>
    </div>
    <input type="file" id="sbImportInput" class="import-input" accept=".json,.md" multiple>

    <div class="sb-tags" id="sbTags"></div>
    <div class="sb-list" id="sbList" data-mh-help="Histórico de Notas: Todos os seus rascunhos e cadernos salvos ficarão listados e organizados por aqui."></div>
  </div>

  <div class="balao" id="balao"></div>

  <div class="toast" id="toast"></div>

  <div class="modal-ov" id="modalOv">
    <div class="modal-box">
      <h3 id="modalTitle">Título</h3>
      <p id="modalText">Texto</p>
      <div class="modal-btns">
        <button class="mb-cancel" id="modalCancel">Cancelar</button>
        <button class="mb-confirm" id="modalConfirm">Confirmar</button>
      </div>
    </div>
  </div>

  <div class="slash-menu" id="slashMenu">
    <div class="slash-item" data-cmd="formatBlock" data-val="<H1>">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 12h16M4 6h16M4 18h16"/></svg>
      Título 1
    </div>
    <div class="slash-item" data-cmd="formatBlock" data-val="<H2>">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 12h16M4 6h16M4 18h16"/></svg>
      Título 2
    </div>
    <div class="slash-item" data-cmd="formatBlock" data-val="<H3>">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 12h16M4 6h16M4 18h16"/></svg>
      Título 3
    </div>
    <div class="slash-item" data-cmd="bold" data-val="">
      <svg class="ic" viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
      Texto em Negrito
    </div>
    <div class="slash-item" data-cmd="italic" data-val="">
      <svg class="ic" viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
      Texto em Itálico
    </div>
    <div class="slash-item" data-cmd="formatBlock" data-val="<BLOCKQUOTE>">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h1c0 1 0 1 0 2v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/></svg>
      Citação
    </div>
    <div class="slash-item" data-cmd="insertOrderedList" data-val="">
      <svg class="ic" viewBox="0 0 24 24"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>
      Lista Numerada
    </div>
    <div class="slash-item" data-cmd="insertUnorderedList" data-val="">
      <svg class="ic" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Lista com Bolinha
    </div>
    <div class="slash-item" data-cmd="customChecklist" data-val="">
      <svg class="ic" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Seleção (Checklist)
    </div>
  </div>

  <script>
    (function () {
      const SORT_KEY = 'balao_notas_sort';
      let notes = [];
      let activeId = null;
      let tagFilter = null;
      let saveTimer = null;
      let sortMode = localStorage.getItem(SORT_KEY);
      if (!['recent', 'alpha', 'created'].includes(sortMode)) sortMode = 'recent';
      let trashView = false;

      const $ = id => document.getElementById(id);

      // ---- SVG icons reutilizáveis ----
      const ICONS = {
        pin: `<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.5 5.5L19 9l-4 3.5L16 18l-4-3-4 3 1-5.5L5 9l5.5-1.5z"/></svg>`,
        duplicate: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="1"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`,
        export: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 10l5 5 5-5M4 21h16"/></svg>`,
        trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`,
        restore: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9"/><polyline points="3 4 3 12 11 12"/></svg>`,
        close: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
        check: `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`
      };

      async function loadNotes() {
        try {
          const data = await window.api.getNotes();
          notes = data && data.length ? data : seedNotes();
        } catch (e) {
          console.error('Erro ao carregar notas:', e);
          notes = seedNotes();
        }
        notes.forEach(n => { if (n.deleted === undefined) n.deleted = false; });
      }
      async function persistNote(n) {
        try {
          await window.api.saveNote(n);
        } catch (e) {
          console.error('Erro ao salvar nota no core:', e);
          showToast('Erro ao salvar nota no servidor.');
        }
      }
      function seedNotes() {
        const now = Date.now();
        const n = {
          id: 'n_' + now + '_' + Math.random().toString(36).slice(2, 7),
          title: 'Bem-vindo',
          body: 'Escreva sua primeira nota aqui.\n\nDigite / para abrir o menu de opções ricas.',
          tags: [],
          pinned: false,
          created: now,
          updated: now,
          deleted: false
        };
        persistNote(n);
        return [n];
      }

      function fmtDate(ts) {
        const d = new Date(ts);
        return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getFullYear()).slice(2)}`;
      }
      function fmtTime(ts) {
        const d = new Date(ts);
        return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }
      function escapeHtml(s) {
        return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      function allTags() {
        const s = new Set();
        notes.forEach(n => (n.tags || []).forEach(t => s.add(t)));
        return [...s];
      }

      function filteredNotes() {
        const q = ($('sbSearch').value || '').toLowerCase().trim();
        let list = notes.filter(n => {
          if (!!n.deleted !== trashView) return false;
          const matchQ = !q || (n.title || '').toLowerCase().includes(q) || (n.body || '').toLowerCase().includes(q);
          const matchTag = !tagFilter || (n.tags || []).includes(tagFilter);
          return matchQ && matchTag;
        });
        if (trashView) {
          list.sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
          return list;
        }
        list.sort((a, b) => {
          if (!!b.pinned !== !!a.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
          if (sortMode === 'alpha') {
            const cmp = (a.title || 'Sem título').localeCompare(b.title || 'Sem título', 'pt-BR', { sensitivity: 'base' });
            return cmp !== 0 ? cmp : (b.updated - a.updated);
          }
          if (sortMode === 'created') return (b.created - a.created) || (b.updated - a.updated);
          return b.updated - a.updated;
        });
        return list;
      }

      // ---- toast ----
      let toastTimer = null;
      function showToast(msg, actionLabel, actionFn) {
        const t = $('toast');
        t.innerHTML = `<span>${escapeHtml(msg)}</span>` + (actionLabel ? `<button id="toastAction">${escapeHtml(actionLabel)}</button>` : '');
        if (actionLabel) $('toastAction').onclick = () => { actionFn(); t.classList.remove('show'); };
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
      }

      // ---- modal ----
      let modalCb = null;
      function showModal(title, text, confirmLabel, cb, danger) {
        $('modalTitle').textContent = title;
        $('modalText').textContent = text;
        const btn = $('modalConfirm');
        btn.textContent = confirmLabel;
        btn.className = 'mb-confirm' + (danger ? ' danger' : '');
        modalCb = cb;
        $('modalOv').classList.add('open');
        const keyHandler = (e) => {
          if (e.key === 'Escape') { closeModal(false); document.removeEventListener('keydown', keyHandler); }
          if (e.key === 'Enter') { closeModal(true); document.removeEventListener('keydown', keyHandler); }
        };
        document.addEventListener('keydown', keyHandler);
      }
      function closeModal(confirmed) {
        $('modalOv').classList.remove('open');
        if (modalCb) { modalCb(confirmed); modalCb = null; }
      }
      $('modalCancel').onclick = () => closeModal(false);
      $('modalConfirm').onclick = () => closeModal(true);

      // ---- slash menu logic ----
      let slashActive = false;
      let slashPos = 0;
      let slashSelectedIndex = 0;

      function closeSlashMenu() {
        slashActive = false;
        $('slashMenu').classList.remove('show');
      }

      function openSlashMenu(textarea) {
        slashActive = true;
        slashSelectedIndex = 0;
        const menu = $('slashMenu');
        menu.classList.add('show');
        updateSlashSelection();
        
        const rect = textarea.getBoundingClientRect();
        menu.style.top = (rect.top + 80) + 'px';
        menu.style.left = (rect.left + 20) + 'px';
      }

      function updateSlashSelection() {
        const items = document.querySelectorAll('.slash-item');
        let currentBlock = '';
        try { currentBlock = document.queryCommandValue('formatBlock') || ''; } catch (e) {}

        items.forEach((item, i) => {
          let isActive = false;
          if (item.dataset.cmd === 'bold') isActive = document.queryCommandState('bold');
          else if (item.dataset.cmd === 'italic') isActive = document.queryCommandState('italic');
          else if (item.dataset.cmd === 'insertOrderedList') isActive = document.queryCommandState('insertOrderedList');
          else if (item.dataset.cmd === 'insertUnorderedList') isActive = document.queryCommandState('insertUnorderedList');
          else if (item.dataset.cmd === 'formatBlock') {
             isActive = currentBlock.toLowerCase() === item.dataset.val.replace(/[<>]/g, '').toLowerCase();
          }

          item.classList.toggle('format-active', isActive);
          item.classList.toggle('active', i === slashSelectedIndex);
        });
      }

      function applySlashAction(item) {
        if(!slashActive) return;
        const ta = $('edBody');
        const cmd = item.dataset.cmd;
        const val = item.dataset.val;
        
        // Pega o estado do bloco ANTES de apagar a barra, para garantir precisão
        let currentBlock = '';
        try { currentBlock = document.queryCommandValue('formatBlock') || ''; } catch(e){}

        const sel = window.getSelection();
        if (sel.rangeCount > 0) {
           const range = sel.getRangeAt(0);
           if(range.startContainer.nodeType === 3) {
             const textNode = range.startContainer;
             const slashPos = textNode.textContent.lastIndexOf('/', range.startOffset);
             if (slashPos >= 0) {
                range.setStart(textNode, slashPos);
                range.setEnd(textNode, slashPos + 1);
                range.deleteContents();
                
                // Previne que o bloco fique completamente vazio sem um <br> (bug do cursor sumir)
                let block = textNode.parentNode;
                if (block && block !== ta && block.textContent === '' && !block.querySelector('br')) {
                   block.innerHTML = '<br>';
                   range.setStart(block, 0);
                   range.collapse(true);
                   sel.removeAllRanges();
                   sel.addRange(range);
                }
             }
           }
        }

        // Se o editor estiver completamente vazio na raiz, cria um bloco básico
        if (ta.innerHTML.trim() === '' || ta.innerHTML === '<br>') {
           ta.innerHTML = '<div><br></div>';
           const range = document.createRange();
           range.setStart(ta.firstChild, 0);
           range.collapse(true);
           const sel2 = window.getSelection();
           sel2.removeAllRanges();
           sel2.addRange(range);
        }

        if (cmd === 'customChecklist') {
           document.execCommand('insertHTML', false, '<div><input type="checkbox" class="ed-chk">&nbsp;</div>');
        } else if (cmd) {
           let valToApply = val;
           if (cmd === 'formatBlock') {
               if (currentBlock.toLowerCase() === val.replace(/[<>]/g, '').toLowerCase()) {
                   valToApply = '<DIV>'; // Deselecionar, voltando ao normal
               }
           }
           document.execCommand(cmd, false, valToApply);
        }
        
        closeSlashMenu();
        onEdit();
        ta.focus();
      }

      document.querySelectorAll('.slash-item').forEach((item, i) => {
        item.onmouseenter = () => { slashSelectedIndex = i; updateSlashSelection(); };
        item.onmousedown = (e) => e.preventDefault(); // Keep focus on editor
        item.onclick = () => applySlashAction(item);
      });

      function handleTextareaKeyDown(e) {
        if(slashActive) {
          const itemsCount = document.querySelectorAll('.slash-item').length;
          if(e.key === 'ArrowDown') {
            slashSelectedIndex = (slashSelectedIndex + 1) % itemsCount;
            updateSlashSelection();
            e.preventDefault();
          } else if(e.key === 'ArrowUp') {
            slashSelectedIndex = (slashSelectedIndex - 1 + itemsCount) % itemsCount;
            updateSlashSelection();
            e.preventDefault();
          } else if(e.key === 'Enter') {
            const items = document.querySelectorAll('.slash-item');
            if(items[slashSelectedIndex]) applySlashAction(items[slashSelectedIndex]);
            e.preventDefault();
          } else if(e.key === 'Escape') {
            closeSlashMenu();
          } else if(e.key !== 'Shift' && e.key !== 'Control' && e.key !== 'Alt') {
            closeSlashMenu();
          }
          return;
        }

        if (e.key === 'Enter' && !e.shiftKey) {
          const sel = window.getSelection();
          if (sel.rangeCount > 0) {
            let node = sel.anchorNode;
            let block = node.nodeType === 3 ? node.parentNode.closest('div, p, li') : node.closest('div, p, li');
            
            // Sair de blocos especiais (citação, títulos) com Enter duplo (linha vazia)
            let specialBlock = node.nodeType === 3 ? node.parentNode.closest('blockquote, h1, h2, h3') : node.closest('blockquote, h1, h2, h3');
            if (specialBlock) {
                let innerBlock = node.nodeType === 3 ? node.parentNode : node;
                // No caso de blockquote, innerBlock pode ser uma div vazia dentro do blockquote.
                // No caso de títulos, o specialBlock e o innerBlock costumam ser o mesmo (o H1).
                if (innerBlock.textContent.trim() === '' || specialBlock.textContent.trim() === '') {
                    e.preventDefault();
                    document.execCommand('formatBlock', false, '<DIV>');
                    return;
                }
            }

            if (block) {
              const chk = block.querySelector('input[type="checkbox"]');
              if (chk) {
                if (block.textContent.trim() === '') {
                  chk.remove();
                  block.style.textDecoration = '';
                  block.style.color = '';
                  return;
                }
                e.preventDefault();
                const newBlock = document.createElement('div');
                const newChk = document.createElement('input');
                newChk.type = 'checkbox';
                newChk.className = 'ed-chk';
                newBlock.appendChild(newChk);
                newBlock.appendChild(document.createTextNode('\u00A0'));
                block.parentNode.insertBefore(newBlock, block.nextSibling);
                const range = document.createRange();
                range.setStart(newBlock.childNodes[1], 1);
                range.collapse(true);
                sel.removeAllRanges();
                sel.addRange(range);
                onEdit();
              }
            }
          }
        }
      }

      function handleTextareaInput(e) {
        const ta = e.target;
        if (e.data === '/') {
          slashPos = window.getSelection().anchorOffset;
          openSlashMenu(ta);
        } else if (slashActive) {
          closeSlashMenu();
        }
        onEdit();
      }

      // ---- render sidebar ----
      function renderTagBar() {
        const bar = $('sbTags');
        const tags = allTags();
        if (!tags.length) { bar.innerHTML = ''; return; }
        bar.innerHTML = tags.map(t => `<div class="sb-tagchip ${t === tagFilter ? 'on' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</div>`).join('');
        bar.querySelectorAll('.sb-tagchip').forEach(el => {
          el.onclick = () => { tagFilter = (tagFilter === el.dataset.tag) ? null : el.dataset.tag; renderTagBar(); renderList(); };
        });
      }

      function renderList() {
        const list = filteredNotes();
        $('sbCount').textContent = notes.filter(n => !n.deleted).length;
        const box = $('sbList');

        if (trashView) {
          if (!list.length) { box.innerHTML = `<div class="sb-empty">Lixeira vazia.</div>`; return; }
          box.innerHTML = `<div class="sb-trash-row"><span>Excluídas somem em 30 dias.</span><button id="sbEmptyTrash">Esvaziar</button></div>` +
            list.map(n => `
        <div class="sb-item" data-id="${n.id}">
          <div class="sb-item-top">
            <div class="sb-item-title">${escapeHtml(n.title || 'Sem título')}</div>
            <div class="sb-actions">
              <button class="sb-actbtn restore" data-act="restore" data-id="${n.id}" title="Restaurar">${ICONS.restore}</button>
              <button class="sb-actbtn purge" data-act="purge" data-id="${n.id}" title="Excluir definitivamente">${ICONS.close}</button>
            </div>
          </div>
          <div class="sb-item-meta">Excluída ${fmtDate(n.deletedAt || n.updated)}</div>
        </div>`).join('');
          box.querySelectorAll('.sb-item').forEach(el => el.addEventListener('click', (e) => {
            if (e.target.closest('.sb-actbtn')) return;
            openNote(el.dataset.id);
          }));
          const et = $('sbEmptyTrash'); if (et) et.onclick = emptyTrash;
          box.querySelectorAll('[data-act="restore"]').forEach(b => b.onclick = (e) => { e.stopPropagation(); restoreNote(b.dataset.id); });
          box.querySelectorAll('[data-act="purge"]').forEach(b => b.onclick = (e) => { e.stopPropagation(); purgeNote(b.dataset.id); });
          return;
        }

        if (!list.length) { box.innerHTML = `<div class="sb-empty">Nenhuma nota encontrada.</div>`; return; }
        box.innerHTML = list.map(n => {
          const snippet = htmlToText(n.body || '').replace(/\n/g, ' ').trim() || 'Sem conteúdo.';
          const tagLabel = (n.tags && n.tags[0]) ? '#' + n.tags[0] : '';
          return `
      <div class="sb-item ${n.id === activeId ? 'active' : ''}" data-id="${n.id}">
        <div class="sb-item-top">
          <div class="sb-item-title">${escapeHtml(n.title || 'Sem título')}</div>
          <div class="sb-pin">${n.pinned ? ICONS.pin : ''}</div>
        </div>
        <div class="sb-item-snip">${escapeHtml(snippet)}</div>
        <div class="sb-item-meta">${fmtDate(n.updated)}${tagLabel ? ' · ' + tagLabel : ''}</div>
      </div>`;
        }).join('');
        box.querySelectorAll('.sb-item').forEach(el => el.addEventListener('click', () => openNote(el.dataset.id)));
      }

      function openNote(id) {
        activeId = id;
        renderList();
        renderEditor();
      }

      // ---- editor (dentro do .balao) ----
      function autoGrowEl(el) {} // Removed textarea autogrow because contenteditable grows naturally

      function renderEditor() {
        const wrap = $('balao');
        const n = notes.find(x => x.id === activeId);
        if (!n) {
          wrap.innerHTML = `<div class="ed-empty">
        <div>${trashView ? 'Nenhuma nota na lixeira selecionada' : 'Nenhuma nota selecionada'}</div>
        <div class="sub">${trashView ? 'ESCOLHA UMA NOTA AO LADO' : 'CRIE UMA NOVA OU ESCOLHA UMA AO LADO'}</div>
      </div>`;
          return;
        }
        if (trashView) { renderEditorTrash(n); return; }

        const idx = notes.findIndex(x => x.id === n.id) + 1;
        wrap.innerHTML = `
      <div class="ed-topline">
        <div class="ed-idx">Ficha Nº ${String(idx).padStart(3, '0')}</div>
        <div class="ed-actions">
          <button class="ed-abtn ${n.pinned ? 'pinned' : ''}" id="edPin" title="Fixar" data-mh-help="Favoritar: Fixe essa nota no topo do histórico para ter acesso instantâneo ao seu caderno mais importante.">${ICONS.pin}</button>
          <button class="ed-abtn" id="edDup" title="Duplicar" data-mh-help="Duplicar: Use este botão para criar um clone rápido da nota e usá-la como template de cópia.">${ICONS.duplicate}</button>
          <button class="ed-abtn" id="edExport" title="Exportar" data-mh-help="Baixar: Exporte seu caderno a qualquer momento como um arquivo Markdown para fazer backup em disco ou compartilhar.">${ICONS.export}</button>
          <button class="ed-abtn danger" id="edDel" title="Excluir" data-mh-help="Apagar: Manda este rascunho direto para a Lixeira.">${ICONS.trash}</button>
        </div>
      </div>
      <div class="ed-header">
        <input class="ed-title" id="edTitle" value="${escapeHtml(n.title || '')}" placeholder="Título da nota" maxlength="46" data-mh-help="Título: Dê um nome fácil e inesquecível para o caderno. Ele será essencial para a busca rápida.">
        <div class="ed-sub"><span>Criada ${fmtDate(n.created)}</span><span>Editada ${fmtDate(n.updated)} ${fmtTime(n.updated)}</span></div>
        <div class="ed-tagbar" id="edTagBar" data-mh-help="Tags: Adicione palavras-chave curtas (ex: faculdade, diário) para agrupar e organizar suas notas por categorias na barra lateral."></div>
        <div class="ed-divider"></div>
      </div>
      <div class="ed-body-scroll">
        <div class="ed-textbody" id="edBody" contenteditable="true" placeholder="Comece a escrever… (digite / para opções)" data-mh-help="Editor Inteligente: Digite livremente e experimente usar a barra '/' para invocar o menu flutuante e transformar blocos de texto.">${DOMPurify.sanitize(n.body || '')}</div>
      </div>
      <div class="ed-footer">
        <div id="edWc">0 palavras</div>
        <div class="ed-saved" data-mh-help="Salvamento Automático: Respire fundo! Tudo o que você digita é salvo instantaneamente na nuvem em tempo real, mesmo se a luz cair."><div class="ed-savedot" id="edSavedDot"></div><span id="edSavedLabel">Salvo</span></div>
      </div>
    `;
        renderTagEditor(n);
        updateWordCount();

        $('edPin').onclick = () => togglePin(n.id);
        $('edDup').onclick = () => duplicateNote(n.id);
        $('edExport').onclick = () => exportNote(n.id);
        $('edDel').onclick = () => deleteNote(n.id);
        $('edTitle').oninput = onEdit;
        $('edBody').oninput = handleTextareaInput;
        $('edBody').addEventListener('keydown', handleTextareaKeyDown);
        $('edBody').addEventListener('change', (e) => {
          if (e.target.type === 'checkbox') {
            const block = e.target.closest('div, p, li');
            if (e.target.checked) {
              e.target.setAttribute('checked', 'checked');
              if (block) {
                block.style.textDecoration = 'line-through';
                block.style.color = 'var(--ink-faint)';
              }
            } else {
              e.target.removeAttribute('checked');
              if (block) {
                block.style.textDecoration = '';
                block.style.color = '';
              }
            }
            onEdit();
          }
        });
      }

      function renderEditorTrash(n) {
        const wrap = $('balao');
        wrap.innerHTML = `
      <div class="ed-topline">
        <div class="ed-idx">Ficha excluída</div>
        <div class="ed-actions">
          <button class="ed-abtn" id="edRestore" title="Restaurar">${ICONS.restore}</button>
          <button class="ed-abtn danger" id="edPurge" title="Excluir definitivamente">${ICONS.close}</button>
        </div>
      </div>
      <div class="ed-header">
        <div class="ed-title" style="opacity:.6">${escapeHtml(n.title || 'Sem título')}</div>
        <div class="ed-sub"><span>Excluída ${fmtDate(n.deletedAt || n.updated)}</span></div>
        <div class="ed-divider"></div>
      </div>
      <div class="ed-body-scroll">
        <div class="ed-textbody" style="pointer-events:none;opacity:.7">${DOMPurify.sanitize(n.body || '')}</div>
      </div>
    `;
        $('edRestore').onclick = () => restoreNote(n.id);
        $('edPurge').onclick = () => purgeNote(n.id);
      }

      function renderTagEditor(n) {
        const bar = $('edTagBar');
        const tagsHtml = (n.tags || []).map(t => `<div class="ed-tag">${escapeHtml(t)}<span class="x" data-t="${escapeHtml(t)}">${ICONS.close}</span></div>`).join('');
        const inputHtml = (n.tags && n.tags.length >= 3) ? '' : `<input class="ed-tag-add" id="edTagAdd" placeholder="+ tag" maxlength="35">`;
        bar.innerHTML = tagsHtml + inputHtml;
        bar.querySelectorAll('.x').forEach(el => el.onclick = () => removeTag(n.id, el.dataset.t));
        const addInput = $('edTagAdd');
        if (addInput) addInput.onkeydown = (e) => { if (e.key === 'Enter') { addTag(n.id, addInput.value); addInput.value = ''; } };
      }

      function addTag(id, val) {
        val = val.trim().toLowerCase();
        if (!val) return;
        if (/[^a-zA-Z0-9\sÀ-ÿ]/.test(val)) { showToast('Caracteres especiais não permitidos'); return; }
        const n = notes.find(x => x.id === id);
        n.tags = n.tags || [];
        if (n.tags.length >= 3) { showToast('Máximo de 3 tags.'); return; }
        if (!n.tags.includes(val)) n.tags.push(val);
        n.updated = Date.now();
        persistNote(n); renderTagBar(); renderTagEditor(n); renderList();
      }
      function removeTag(id, t) {
        const n = notes.find(x => x.id === id);
        n.tags = (n.tags || []).filter(x => x !== t);
        n.updated = Date.now();
        persistNote(n); renderTagBar(); renderTagEditor(n); renderList();
      }

      function updateWordCount() {
        const body = htmlToText($('edBody').innerHTML || '');
        const words = body.trim().length ? body.trim().split(/\s+/).length : 0;
        $('edWc').textContent = `${words} palavra${words === 1 ? '' : 's'}`;
      }

      function onEdit() {
        const n = notes.find(x => x.id === activeId);
        if (!n) return;

        const elTitle = $('edTitle');
        const elBody = $('edBody');
        let bodyVal = elBody.innerHTML;
        
        n.title = elTitle.value;
        n.body = bodyVal;
        n.updated = Date.now();
        updateWordCount();
        $('edSavedDot').classList.add('saving');
        $('edSavedLabel').textContent = 'Salvando…';
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          await persistNote(n);
          renderList();
          const dot = $('edSavedDot'), lbl = $('edSavedLabel');
          if (dot) dot.classList.remove('saving');
          if (lbl) lbl.textContent = 'Salvo';
        }, 2000); // Increased debounce to 2 seconds to reduce server requests
      }

      function togglePin(id) {
        const n = notes.find(x => x.id === id);
        if (!n.pinned) {
          const pinnedCount = notes.filter(x => !x.deleted && x.pinned).length;
          if (pinnedCount >= 5) { showToast('Limite máximo de 5 notas favoritas.'); return; }
        }
        n.pinned = !n.pinned;
        persistNote(n); renderList(); renderEditor();
      }

      async function duplicateNote(id) {
        if (trashView) return;
        const activeCount = notes.filter(x => !x.deleted).length;
        if (activeCount >= 20) { showToast('Limite máximo de 20 notas ativas.'); return; }
        const n = notes.find(x => x.id === id);
        if (!n) return;
        const now = Date.now();
        const copy = { ...n, id: 'n_' + now + '_' + Math.random().toString(36).slice(2, 7), title: (n.title || 'Sem título') + ' (cópia)', tags: [...(n.tags || [])], created: now, updated: now };
        const idx = notes.findIndex(x => x.id === id);
        notes.splice(idx + 1, 0, copy);
        activeId = copy.id;
        await persistNote(copy);
        renderTagBar(); renderList(); renderEditor();
        showToast('Nota duplicada.');
      }

      function htmlToText(html) {
        const tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
      }

      function noteToMd(n) {
        const tagLine = (n.tags && n.tags.length) ? `\n\nTags: ${n.tags.map(t => '#' + t).join(' ')}` : '';
        return `# ${n.title || 'Sem título'}\n\n${htmlToText(n.body || '')}${tagLine}\n`;
      }
      function slugify(s) {
        return (s || 'nota').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'nota';
      }
      function downloadFile(filename, content, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      }
      function exportNote(id) {
        const n = notes.find(x => x.id === id);
        if (!n) return;
        downloadFile(`${slugify(n.title)}.md`, noteToMd(n), 'text/markdown');
        showToast('Nota exportada como .md');
      }



      async function deleteNote(id) {
        const n = notes.find(x => x.id === id);
        if (!n) return;
        n.deleted = true;
        n.deletedAt = Date.now();
        try {
          await window.api.deleteNote(id);
        } catch (e) {
          if (e.message && e.message.includes('TRASH_FULL')) {
            n.deleted = false;
            showModal('Lixeira Cheia', 'Sua lixeira já atingiu o limite de 6 notas. Deseja esvaziá-la agora para continuar apagando?', 'Esvaziar Lixeira', async (confirmed) => {
              if (confirmed) {
                notes = notes.filter(x => !x.deleted);
                try { await window.api.emptyNotesTrash(); } catch (err) { }
                deleteNote(id);
              }
            }, true);
            return;
          }
          console.error(e);
        }
        const remaining = filteredNotes();
        activeId = remaining.length ? remaining[0].id : null;
        renderTagBar(); renderList(); renderEditor(); updateTrashLabel();
        showToast('Nota movida para a lixeira.', 'Desfazer', () => restoreNote(id));
      }
      async function restoreNote(id) {
        const n = notes.find(x => x.id === id);
        if (!n) return;
        n.deleted = false;
        delete n.deletedAt;
        n.updated = Date.now();
        try { await window.api.restoreNote(id); } catch (e) { console.error(e); }
        renderTagBar(); renderList(); updateTrashLabel();
        showToast('Nota restaurada.');
      }
      function purgeNote(id) {
        showModal('Excluir Nota', 'Excluir esta nota permanentemente? Esta ação não pode ser desfeita.', 'Excluir', async (confirmed) => {
          if (!confirmed) return;
          notes = notes.filter(x => x.id !== id);
          if (activeId === id) activeId = null;
          try { await window.api.purgeNote(id); } catch (e) { console.error(e); }
          renderList(); renderEditor(); updateTrashLabel();
          showToast('Nota excluída.');
        }, true);
      }
      function emptyTrash() {
        const count = notes.filter(n => n.deleted).length;
        if (!count) return;
        showModal('Esvaziar Lixeira', `Excluir permanentemente ${count} nota${count === 1 ? '' : 's'} da lixeira?`, 'Esvaziar', async (confirmed) => {
          if (!confirmed) return;
          notes = notes.filter(x => !x.deleted);
          activeId = null;
          try { await window.api.emptyNotesTrash(); } catch (e) { console.error(e); }
          renderList(); renderEditor(); updateTrashLabel();
          showToast('Lixeira esvaziada.');
        }, true);
      }

      async function createNote() {
        if (trashView) return;
        const activeCount = notes.filter(x => !x.deleted).length;
        if (activeCount >= 20) { showToast('Limite máximo de 20 notas ativas.'); return; }
        const now = Date.now();
        const n = { id: 'n_' + now + '_' + Math.random().toString(36).slice(2, 7), title: '', body: '', tags: [], pinned: false, created: now, updated: now, deleted: false };
        
        try {
          await window.api.saveNote(n);
          notes.unshift(n);
          activeId = n.id;
          renderTagBar(); renderList(); renderEditor();
          setTimeout(() => $('edTitle')?.focus(), 30);
        } catch (e) {
          console.error('Erro ao criar nota no backend:', e);
          const msg = e.error || e.message || 'Erro ao criar nota no servidor.';
          showToast(msg);
        }
      }
      window.createNote = createNote;

      function toggleTrashView() {
        trashView = !trashView;
        $('sbTrashBtn').classList.toggle('on', trashView);
        $('sbNewBtn').style.visibility = trashView ? 'hidden' : 'visible';
        activeId = null;
        updateTrashLabel();
        renderTagBar(); renderList(); renderEditor();
      }
      function updateTrashLabel() {
        const count = notes.filter(n => n.deleted).length;
        const base = trashView ? 'Notas' : 'Lixeira';
        $('sbTrashLabel').textContent = (!trashView && count) ? `${base} (${count})` : base;
      }

      // ---- eventos globais ----
      $('sbSearch').addEventListener('input', renderList);
      $('sbNewBtn').onclick = createNote;
      $('sbTrashBtn').onclick = toggleTrashView;
      $('sbImportBtn').onclick = () => showToast('Disponível após a beta.');

      const sortLabels = { recent: 'Recentes', alpha: 'Alfabética', created: 'Criação' };
      $('sbSortLabel').textContent = sortLabels[sortMode];
      $('sbSortBtn').onclick = () => {
        const order = ['recent', 'alpha', 'created'];
        sortMode = order[(order.indexOf(sortMode) + 1) % order.length];
        localStorage.setItem(SORT_KEY, sortMode);
        $('sbSortLabel').textContent = sortLabels[sortMode];
        renderList();
      };

      document.addEventListener('keydown', (e) => {
        const mod = e.ctrlKey || e.metaKey;
        if (!mod) return;
        const tagInput = document.activeElement && document.activeElement.id === 'edTagAdd';
        if (e.key.toLowerCase() === 'n' && !tagInput) { e.preventDefault(); createNote(); }
        else if (e.key.toLowerCase() === 'f') { e.preventDefault(); $('sbSearch').focus(); $('sbSearch').select(); }
        else if (e.key.toLowerCase() === 'd' && activeId && !trashView) { e.preventDefault(); duplicateNote(activeId); }
      });

      document.addEventListener('wheel', (e) => {
        const target = e.target.closest('.sb-list, .ed-body-scroll');
        if (target) {
          e.preventDefault();
          target.scrollTop += e.deltaY * 0.7;
          target.scrollLeft += e.deltaX * 0.7;
        }
      }, { passive: false });

      // ---- init ----
      document.addEventListener('DOMContentLoaded', async function () {
        await loadNotes();
        const initial = filteredNotes();
        activeId = initial.length ? initial[0].id : null;
        updateTrashLabel();
        renderTagBar();
        renderList();
        renderEditor();
        if (typeof window.hideMhLoader === 'function') {
          window.hideMhLoader();
        }
      });
    })();
  </script>
  <script src="api-client.js"></script>
  <script src="shared.js?v=1788736543501"></script>
</body>
